name: Actualizar Dashboard Grupo Cementero

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar datos.json
        env:
          NAVIXY_HASH: ${{ secrets.NAVIXY_HASH }}
        run: python scripts/generar_datos.py

      - name: Enviar email de resumen
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:       manuelpolo@npgservices.com
          EMAIL_CC:       npolo2807@gmail.com
        run: python scripts/enviar_email.py

      - name: Commit y push datos.json
        run: |
          git config user.name  "Dashboard Bot"
          git config user.email "bot@npgservices.com"
          git add datos.json
          git diff --staged --quiet || git commit -m "datos: actualizacion diaria"
          git push
